<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema Lava-Jato</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .register-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e3c72;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .register-container h2 .fa-car {
            color: #00aaff;
            font-size: 1.5em;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group .icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #007acc;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: 2px solid #ddeeff;
            border-radius: 10px;
            font-size: 16px;
            background-color: #f7fbff;
            color: #1e3c72;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00aaff;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(0, 170, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00aaff, #005f99);
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 122, 204, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 122, 204, 0.6);
        }

        .extra-links {
            text-align: center;
            margin-top: 30px;
        }

        .extra-links a {
            color: #007acc;
            text-decoration: none;
            font-size: 14px;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <form id="registerForm">
            <h2>
                <i class="fas fa-car"></i>
                Cadastrar Lava-Jato
            </h2>

            <div class="input-group">
                <i class="fas fa-building icon"></i>
                <input type="text" id="nomeLavajato" placeholder="Nome do Lava-Jato" required>
            </div>

            <div class="input-group">
                <i class="fas fa-user icon"></i>
                <input type="text" id="nomeDono" placeholder="Nome do Proprietário" required>
            </div>

            <div class="input-group">
                <i class="fas fa-envelope icon"></i>
                <input type="email" id="email" placeholder="E-mail" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="senha" placeholder="Senha" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="confirmarSenha" placeholder="Confirmar senha" required>
            </div>

            <button type="submit">Cadastrar</button>

            <div class="extra-links">
                <a href="login.html">Já tem uma conta? Entrar</a>
            </div>
        </form>
    </div>

     <script src="/Scripts/cadastro.js"></script>
</body>
